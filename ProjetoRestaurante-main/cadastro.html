<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="shortcut icon" href="img/Logo-Circular-Chapa-Quente.ico">
    <link rel="stylesheet" href="style-cadastro.css">

</head>

<body>
    <div class="boxzinho">
    <img src="img/Ícone Glossy de Adicionar Usuário.png" alt="">
    <h1>Cadastro</h1>
    <p class="topo">
        Crie sua conta para começar
    </p>

    <form>

    <div class="nome">
        <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
    </div>

    <p id="erronome"></p>

    <div class="cpf">
        <img src="img/Ícone_de_usuário_branco_brilhante-removebg-preview.png" alt="">
        <input type="CPF" id="CPF" name="CPF" placeholder="Digite seu CPF" maxlength="14" inputmode="numeric" autocomplete="off">
    </div>

    <p id="errocpf"></p>

    <div class="e-mail">
        <img src="img/Ícone de Envelope Branco Minimalista.png" alt="">
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="off">
    </div>

    <p id="erroEmail"></p>

    <div class="senha">
        
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
        <button type="button" id="mostrar" class="mostrarsenha"></button>
        

    </div>

    <p id="errosenha"></p>

    <div class="c-senha">
        <img src="img/Ícone de Cadeado Branco Minimalista.png" alt="">
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente">
        <button type="button" id="mostrar2" class="mostrarsenha-2"></button>

    </div>
    <p id="senhaigual"></p>

    <div>
        <button type="button" id="cadastro">Cadastrar</button>
    </div>

    </form>

    <p>
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>
    </div>
    <script type="module">
        import { validarEmail, 
                 validarCPF, 
                 validarNome,
                 validarSenha } from './funcoes.js';

        import { darFetch } from './fetchCadastro.js';

        let CPFbonitinho = document.getElementById("CPF");

        CPFbonitinho.addEventListener("input", function(){
            let numeros = CPFbonitinho.value.replace(/\D/g, "");
            numeros = numeros.substring(0, 11);

            if (numeros.length > 9) {
                numeros = numeros.replace(
                    /^(\d{3})(\d{3})(\d{3})(\d{1,2}).*/,
                    "$1.$2.$3-$4"
                );
            } else if (numeros.length > 6) {
                numeros = numeros.replace(
                    /^(\d{3})(\d{3})(\d{1,3}).*/,
                    "$1.$2.$3"
                );
            } else if (numeros.length > 3) {
                numeros = numeros.replace(
                    /^(\d{3})(\d{1,3}).*/,
                    "$1.$2"
                );
            }
            CPFbonitinho.value = numeros;
        });


        let mostrar = document.getElementById("mostrar");
        let senhaOculta = document.getElementById("senha");
        let confirmarOculta = document.getElementById("confirmar-senha");
        let mostrar2 = document.getElementById("mostrar2");
        
        let ocultar1 = 0;
        let ocultar2 = 0;

        mostrar.addEventListener("click", function(){
            if(ocultar1 === 1){
                mostrar.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
                senhaOculta.type = "password";
                ocultar1 = 0;
            } else {
                mostrar.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
                senhaOculta.type = "text";
                ocultar1 = 1;
            }
        });

        mostrar2.addEventListener("click", function(){
            if(ocultar2 === 1){
                mostrar2.style.backgroundImage = "url('img/Ícone de olho oculto minimalista.png')";
                confirmarOculta.type = "password";
                ocultar2 = 0;
            } else {
                mostrar2.style.backgroundImage = "url('img/Ícone de Olho Branco Minimalista.png')";
                confirmarOculta.type = "text";
                ocultar2 = 1;
            }
        });

    
        let botao = document.getElementById("cadastro");
        botao.addEventListener("click", function(event){
            event.preventDefault();

            let cpf = document.getElementById("CPF").value;
            let nome = document.getElementById("nome").value;
            let senha = document.getElementById("senha").value;
            let email = document.getElementById("email").value;
            let csenha = document.getElementById("confirmar-senha").value;
            
            let erroSenha = document.getElementById("errosenha");
            let erroNome = document.getElementById("erronome");
            let senhaIgual = document.getElementById("senhaigual");
            let erroCpf = document.getElementById("errocpf");
            let erroEmail = document.getElementById("erroEmail");

            let nomePassou = false;
            let cpfPassou = false;
            let emailPassou = false;
            let senhaPassou = false;
            let cSenhaPassou = false;
            let duasSenhasIguais = false;
            
            if (!validarNome(nome)) {
                erroNome.textContent = "Seu nome não está correto ou é inválido.";
                erroNome.style.color = "white";
                nomePassou = false;
            } else {
                erroNome.textContent = "";
                nomePassou = true;
            }

            
            if (!validarCPF(cpf)) {
                erroCpf.textContent = "Seu CPF não está correto ou é inválido.";
                erroCpf.style.color = "white";
                cpfPassou = false;
            } else {
                erroCpf.textContent = "";
                cpfPassou = true;
            }
            
            
            if (!validarEmail(email)) {
                erroEmail.textContent = "O e-mail tem que ser válido.";
                erroEmail.style.color = "white";
                emailPassou = false;
            } else {
                erroEmail.textContent = "";
                emailPassou = true;
            }


             if (!validarSenha(senha)) {
                erroSenha.textContent = "A senha não atende aos requisitos.";
                erroSenha.style.color = "white";
                senhaPassou = false;
            } else {
                erroSenha.textContent = "";
                senhaPassou = true;
            }


            if (senha !== csenha) {
                senhaIgual.textContent = "As senhas não coincidem.";
                senhaIgual.style.color = "white";
                cSenhaPassou = false;
            } else {
                senhaIgual.textContent = "";
                cSenhaPassou = true;
            }

            duasSenhasIguais = senhaPassou && cSenhaPassou;

            
            if  (erroNome.textContent === "" &&
                    erroCpf.textContent === "" &&
                    erroSenha.textContent === "" &&
                    senhaIgual.textContent === "" &&
                    erroEmail.textContent === "") {

                 let dados = {
                        CPF: cpf,
                        Nome: nome,
                        Senha: senha,
                        Email: email
                };



    let texto = JSON.stringify(dados);
}

            if (cpfPassou === true && nomePassou === true && duasSenhasIguais === true && emailPassou === true){
                const nomeDoFetch = document.querySelector("#nome");
                const emailDoFetch = document.querySelector("#email");
                const cpfDoFetch = document.querySelector("#CPF");
                const senhaDoFetch = document.querySelector("#senha");
                
                //A ordem é nome, email, cpf, senha
                darFetch(nomeDoFetch.value, emailDoFetch.value, cpfDoFetch.value, senhaDoFetch.value);
                window.location.href = "login.html";
                
            }
        });

</script>
</body>
</html>
